services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: taskmaster
      POSTGRES_DB: taskmaster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster -d taskmaster"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taskmaster-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - JWT_SECRET=taskmaster_secret_key_change_this_in_production
      - NODE_ENV=production
      - DATABASE_URL=postgresql://taskmaster:taskmaster@db:5432/taskmaster
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskmaster-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - REACT_APP_API_URL=http://localhost:8001/api
    depends_on:
      - backend
    networks:
      - taskmaster-network

networks:
  taskmaster-network:
    driver: bridge

volumes:
  postgres_data:
